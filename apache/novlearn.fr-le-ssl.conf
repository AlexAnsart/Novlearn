<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName novlearn.fr
    ServerAlias www.novlearn.fr
    DocumentRoot /var/www/novlearn

    <Directory /var/www/novlearn>
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine on

    # ==========================================
    # 1. COLYSEUS DUEL SERVER (Port 2567 - production)
    # ==========================================
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/duel-ws/(.*) ws://localhost:2567/$1 [P,L]

    ProxyPass /duel-ws/ http://localhost:2567/
    ProxyPassReverse /duel-ws/ http://localhost:2567/

    # ==========================================
    # 2. EXCEPTIONS NEXT.JS (Port 3000 - production)
    # ==========================================
    ProxyPass /api/exercises http://localhost:3000/api/exercises
    ProxyPassReverse /api/exercises http://localhost:3000/api/exercises

    ProxyPass /api/delete-account http://localhost:3000/api/delete-account
    ProxyPassReverse /api/delete-account http://localhost:3000/api/delete-account

    # ==========================================
    # 3. BACKEND PYTHON (Port 8010 - production)
    # ==========================================
    ProxyPass /api http://localhost:8010/api
    ProxyPassReverse /api http://localhost:8010/api

    ProxyPass /health http://localhost:8010/health
    ProxyPassReverse /health http://localhost:8010/health

    # ==========================================
    # 4. FRONTEND NEXT.JS (Port 3000 - production)
    # ==========================================
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "novlearn.fr"

    ErrorLog ${APACHE_LOG_DIR}/error_novlearn.log
    CustomLog ${APACHE_LOG_DIR}/access_novlearn.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/novlearn.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/novlearn.fr/privkey.pem
</VirtualHost>

<VirtualHost *:443>
    ServerName staging.novlearn.fr
    DocumentRoot /var/www/novlearn-staging

    <Directory /var/www/novlearn-staging>
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine on

    # Duel server staging (Port 2568)
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/duel-ws/(.*) ws://localhost:2568/$1 [P,L]

    ProxyPass /duel-ws/ http://localhost:2568/
    ProxyPassReverse /duel-ws/ http://localhost:2568/

    # Backend staging (Port 8011)
    ProxyPass /api http://localhost:8011/api
    ProxyPassReverse /api http://localhost:8011/api

    ProxyPass /health http://localhost:8011/health
    ProxyPassReverse /health http://localhost:8011/health

    # Frontend staging (Port 3001)
    ProxyPass / http://localhost:3001/
    ProxyPassReverse / http://localhost:3001/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "staging.novlearn.fr"

    ErrorLog ${APACHE_LOG_DIR}/error_novlearn_staging.log
    CustomLog ${APACHE_LOG_DIR}/access_novlearn_staging.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/staging.novlearn.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staging.novlearn.fr/privkey.pem
</VirtualHost>
</IfModule>
