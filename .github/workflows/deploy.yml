name: Deploy to VPS

on:
  push:
    branches: [develop, main]

jobs:
  # ---- STAGING: only on push to develop ----
  deploy_staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (staging)
        working-directory: ./frontend
        run: npm install --prefer-offline --no-audit

      - name: Build frontend (staging)
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://staging.novlearn.fr
          NEXT_PUBLIC_COLYSEUS_URL: https://staging.novlearn.fr/duel-ws
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}

      - name: Create .env file for backend (staging)
        run: |
          mkdir -p backend
          echo "# Novlearn Backend Configuration (staging)" > backend/.env
          echo "APP_ENV=staging" >> backend/.env
          echo "DEBUG=False" >> backend/.env
          echo "HOST=0.0.0.0" >> backend/.env
          echo "PORT=8011" >> backend/.env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> backend/.env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> backend/.env
          echo "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> backend/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> backend/.env
          echo "CORS_ORIGINS=https://novlearn.fr,https://www.novlearn.fr,https://staging.novlearn.fr" >> backend/.env
          echo "LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}" >> backend/.env

      - name: Create .env file for duel-server (staging)
        run: |
          mkdir -p duel-server
          echo "# Novlearn Duel-server (Colyseus) Configuration - staging" > duel-server/.env
          echo "PORT=2568" >> duel-server/.env
          echo "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> duel-server/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> duel-server/.env

      - name: Clean stale frontend source files on VPS (staging)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -rf /opt/novlearn-staging/frontend/app
            rm -rf /opt/novlearn-staging/frontend/public
            echo "✅ Anciens fichiers source staging supprimés"

      - name: Deploy frontend code to VPS (staging)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/**"
          target: "/opt/novlearn-staging"
          strip_components: 0

      - name: Deploy shared config to VPS (staging)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "shared/**"
          target: "/opt/novlearn-staging"
          strip_components: 0

      - name: Deploy backend code and .env to VPS (staging)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/**,backend/.env"
          target: "/opt/novlearn-staging"
          strip_components: 0

      - name: Deploy duel-server code to VPS (staging)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "duel-server/**"
          target: "/opt/novlearn-staging"
          strip_components: 0

      - name: Deploy deploy script to VPS (staging)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.sh"
          target: "/opt/novlearn-staging"
          strip_components: 0

      - name: Setup and run staging stack (no systemd)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/novlearn-staging
            sudo chown -R $USER:$USER /opt/novlearn-staging
            cd /opt/novlearn-staging

            # Backend venv + deps
            cd backend
            if ! command -v python3 &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y python3 python3-venv python3-pip
            fi
            if [ ! -d venv ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Restart staging backend (port 8011)
            if [ -f backend-staging.pid ]; then
              OLD_PID=$(cat backend-staging.pid || echo "")
              if [ ! -z "$OLD_PID" ] && ps -p $OLD_PID > /dev/null 2>&1; then
                kill $OLD_PID || true
              fi
            fi
            nohup venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8011 --log-level info > ../backend-staging.log 2>&1 &
            echo $! > backend-staging.pid

            # Frontend build + start (port 3001)
            cd /opt/novlearn-staging/frontend
            if ! command -v node &> /dev/null || ! command -v npm &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            npm install --prefer-offline --no-audit
            npm run build

            # Kill previous staging frontend if any
            if [ -f frontend-staging.pid ]; then
              OLD_FP=$(cat frontend-staging.pid || echo "")
              if [ ! -z "$OLD_FP" ] && ps -p $OLD_FP > /dev/null 2>&1; then
                kill $OLD_FP || true
              fi
            fi
            nohup npm start -- --port 3001 > ../frontend-staging.log 2>&1 &
            echo $! > frontend-staging.pid

      - name: Verify staging deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sleep 5
            curl -f http://localhost:8011/health || { echo "❌ Backend staging error"; exit 1; }
            curl -f http://localhost:3001 || { echo "❌ Frontend staging error"; exit 1; }
            echo "✅ Déploiement staging vérifié"

  # ---- PRODUCTION: only on push to main ----
  deploy_production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Use npm install instead of npm ci to avoid lockfile sync false positives (e.g. ajv nested deps)
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --prefer-offline --no-audit

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://novlearn.fr
          NEXT_PUBLIC_COLYSEUS_URL: https://novlearn.fr/duel-ws
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}

      - name: Create .env file for backend
        run: |
          echo "# Novlearn Backend Configuration" > backend/.env
          echo "APP_ENV=production" >> backend/.env
          echo "DEBUG=False" >> backend/.env
          echo "HOST=0.0.0.0" >> backend/.env
          echo "PORT=8010" >> backend/.env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> backend/.env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> backend/.env
          echo "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> backend/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> backend/.env
          echo "CORS_ORIGINS=https://novlearn.fr,https://www.novlearn.fr" >> backend/.env
          echo "LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}" >> backend/.env

      - name: Create .env file for duel-server
        run: |
          echo "# Novlearn Duel-server (Colyseus) Configuration" > duel-server/.env
          echo "PORT=2567" >> duel-server/.env
          echo "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> duel-server/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> duel-server/.env

      - name: Clean stale frontend source files on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -rf /opt/novlearn/frontend/app
            rm -rf /opt/novlearn/frontend/public
            echo "✅ Anciens fichiers source supprimés"

      - name: Deploy frontend code to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/**"
          target: "/opt/novlearn"
          strip_components: 0

      - name: Deploy shared config to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "shared/**"
          target: "/opt/novlearn"
          strip_components: 0

      - name: Deploy backend code and .env to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/**,backend/.env"
          target: "/opt/novlearn"
          strip_components: 0

      - name: Deploy duel-server code to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "duel-server/**"
          target: "/opt/novlearn"
          strip_components: 0

      - name: Deploy deploy script to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.sh"
          target: "/opt/novlearn"
          strip_components: 0

      - name: Cleanup old systemd service files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -rf /tmp/novlearn-backend.service
            rm -rf /tmp/novlearn-frontend.service
            rm -rf /tmp/novlearn-duel-server.service

      - name: Deploy systemd services to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "systemd/*.service"
          target: "/tmp/"
          strip_components: 1

      - name: Deploy Apache configuration to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "apache/*.conf"
          target: "/tmp/"
          strip_components: 1

      - name: Configure Apache and ensure it's running
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔧 Configuration d'Apache..."

            if ! command -v apache2 &> /dev/null; then
              echo "📦 Installation d'Apache..."
              sudo apt-get update
              sudo apt-get install -y apache2
            fi

            echo "📦 Activation des modules Apache nécessaires..."
            sudo a2enmod proxy
            sudo a2enmod proxy_http
            sudo a2enmod proxy_wstunnel
            sudo a2enmod ssl
            sudo a2enmod rewrite
            sudo a2enmod headers

            if systemctl is-active --quiet nginx 2>/dev/null; then
              echo "⚠️  Nginx est actif. Arrêt de nginx pour éviter les conflits..."
              sudo systemctl stop nginx
              sudo systemctl disable nginx
            fi

            if ! systemctl is-active --quiet apache2; then
              echo "🚀 Démarrage d'Apache..."
              sudo systemctl start apache2
            fi
            if ! systemctl is-enabled --quiet apache2; then
              echo "✅ Activation d'Apache au démarrage..."
              sudo systemctl enable apache2
            fi

            echo "📝 Déploiement des configurations Apache..."

            if [ -f /tmp/novlearn.fr.conf ]; then
              sudo cp /tmp/novlearn.fr.conf /etc/apache2/sites-available/novlearn.fr.conf
              echo "✅ Configuration HTTP déployée"
            else
              echo "❌ Erreur: /tmp/novlearn.fr.conf introuvable"
              exit 1
            fi

            if [ -f /tmp/novlearn.fr-le-ssl.conf ]; then
              sudo cp /tmp/novlearn.fr-le-ssl.conf /etc/apache2/sites-available/novlearn.fr-le-ssl.conf
              echo "✅ Configuration HTTPS déployée"
            else
              echo "❌ Erreur: /tmp/novlearn.fr-le-ssl.conf introuvable"
              exit 1
            fi

            echo "🔗 Activation des sites Apache..."
            sudo a2ensite novlearn.fr.conf
            sudo a2ensite novlearn.fr-le-ssl.conf

            if [ -f /etc/apache2/sites-enabled/000-default.conf ]; then
              echo "🔇 Désactivation du site par défaut d'Apache..."
              sudo a2dissite 000-default.conf
            fi

            echo "🔍 Test de la configuration Apache..."
            if sudo apache2ctl configtest; then
              echo "✅ Configuration Apache valide"
            else
              echo "❌ Erreur dans la configuration Apache"
              exit 1
            fi

            echo "🔄 Rechargement d'Apache..."
            sudo systemctl reload apache2 || sudo systemctl restart apache2

            if systemctl is-active --quiet apache2; then
              echo "✅ Apache est actif et fonctionne"
            else
              echo "❌ Erreur: Apache n'est pas actif"
              sudo systemctl status apache2
              exit 1
            fi

            sudo mkdir -p /var/www/novlearn/.well-known
            sudo chown -R $USER:$USER /var/www/novlearn

      - name: Setup and deploy application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/novlearn
            sudo chown -R $USER:$USER /opt/novlearn

            echo "🧹 Nettoyage du cache .next..."
            rm -rf /opt/novlearn/frontend/.next

            if ! command -v node &> /dev/null || ! command -v npm &> /dev/null; then
              echo "📦 Installation de Node.js et npm..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
              if ! command -v npm &> /dev/null; then
                sudo apt-get install -y npm
              fi
            fi

            NODE_PATH=$(which node 2>/dev/null || echo "/usr/bin/node")
            NPM_PATH=$(which npm 2>/dev/null || echo "/usr/bin/npm")

            export PATH="/usr/bin:/usr/local/bin:$PATH"

            if [ -f "$NODE_PATH" ]; then
              NODE_DIR=$(dirname "$NODE_PATH")
              export PATH="$NODE_DIR:$PATH"
            fi
            if [ -f "$NPM_PATH" ]; then
              NPM_DIR=$(dirname "$NPM_PATH")
              export PATH="$NPM_DIR:$PATH"
            fi

            echo "🔧 Configuration des services systemd..."

            sudo sed "s/YOUR_USERNAME/$USER/g" /tmp/novlearn-backend.service > /tmp/novlearn-backend.service.tmp
            sudo mv /tmp/novlearn-backend.service.tmp /etc/systemd/system/novlearn-backend.service
            sudo systemctl daemon-reload

            if sudo systemctl is-enabled novlearn-backend 2>&1 | grep -q "masked"; then
              sudo systemctl unmask novlearn-backend
            fi
            sudo systemctl enable novlearn-backend

            if sudo systemctl is-active --quiet novlearn-backend; then
              sudo systemctl restart novlearn-backend
            else
              sudo systemctl start novlearn-backend
            fi

            sudo sed "s/YOUR_USERNAME/$USER/g" /tmp/novlearn-frontend.service > /tmp/novlearn-frontend.service.tmp
            sudo mv /tmp/novlearn-frontend.service.tmp /etc/systemd/system/novlearn-frontend.service
            sudo systemctl daemon-reload

            if sudo systemctl is-enabled novlearn-frontend 2>&1 | grep -q "masked"; then
              sudo systemctl unmask novlearn-frontend
            fi
            sudo systemctl enable novlearn-frontend

            if sudo systemctl is-active --quiet novlearn-frontend; then
              sudo systemctl restart novlearn-frontend
            else
              sudo systemctl start novlearn-frontend
            fi

            sudo sed "s/YOUR_USERNAME/$USER/g" /tmp/novlearn-duel-server.service > /tmp/novlearn-duel-server.service.tmp
            sudo mv /tmp/novlearn-duel-server.service.tmp /etc/systemd/system/novlearn-duel-server.service
            sudo systemctl daemon-reload

            if sudo systemctl is-enabled novlearn-duel-server 2>&1 | grep -q "masked"; then
              sudo systemctl unmask novlearn-duel-server
            fi
            sudo systemctl enable novlearn-duel-server

            if sudo systemctl is-active --quiet novlearn-duel-server; then
              sudo systemctl restart novlearn-duel-server
            else
              sudo systemctl start novlearn-duel-server
            fi

            cd /opt/novlearn

            chmod +x deploy.sh

            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > /opt/novlearn/frontend/.env.local
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> /opt/novlearn/frontend/.env.local
            echo "NEXT_PUBLIC_SITE_URL=https://novlearn.fr" >> /opt/novlearn/frontend/.env.local
            echo "NEXT_PUBLIC_COLYSEUS_URL=https://novlearn.fr/duel-ws" >> /opt/novlearn/frontend/.env.local
            echo "NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}" >> /opt/novlearn/frontend/.env.local
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> /opt/novlearn/frontend/.env.local
            echo "ADMIN_API_SECRET=${{ secrets.ADMIN_API_SECRET }}" >> /opt/novlearn/frontend/.env.local

            export PATH="/usr/bin:/usr/local/bin:$PATH"
            ./deploy.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sleep 5

            if ! systemctl is-active --quiet apache2; then
              echo "❌ Apache inactif"
              exit 1
            fi

            curl -f http://localhost:8010/health || {
              echo "❌ Backend error"
              sudo journalctl -u novlearn-backend -n 20
              exit 1
            }

            curl -f http://localhost:3000 || {
              echo "❌ Frontend error"
              sudo journalctl -u novlearn-frontend -n 20
              exit 1
            }

            echo "✅ Déploiement vérifié avec succès"
