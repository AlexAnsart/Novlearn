name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Create .env file for backend
        run: |
          echo "# Novlearn Backend Configuration" > backend/.env
          echo "APP_ENV=production" >> backend/.env
          echo "DEBUG=False" >> backend/.env
          echo "HOST=0.0.0.0" >> backend/.env
          echo "PORT=8010" >> backend/.env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> backend/.env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> backend/.env
          echo "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> backend/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> backend/.env
          echo "CORS_ORIGINS=https://novlearn.fr,https://www.novlearn.fr" >> backend/.env
          echo "LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}" >> backend/.env

      - name: Deploy frontend code to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/**"
          target: "/opt/novlearn"
          strip_components: 0

      - name: Deploy backend code and .env to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/**,backend/.env"
          target: "/opt/novlearn"
          strip_components: 0

      - name: Deploy deploy script to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.sh"
          target: "/opt/novlearn"
          strip_components: 0

      - name: Cleanup old systemd service files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Supprimer les fichiers systemd s'ils existent déjà dans /tmp/
            rm -rf /tmp/novlearn-backend.service
            rm -rf /tmp/novlearn-frontend.service

      - name: Deploy systemd services to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "systemd/*.service"
          target: "/tmp/"
          strip_components: 1

      - name: Deploy Apache configuration to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "apache/*.conf"
          target: "/tmp/"
          strip_components: 1

      - name: Configure Apache and ensure it's running
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔧 Configuration d'Apache..."

            # Installer Apache si nécessaire
            if ! command -v apache2 &> /dev/null; then
              echo "📦 Installation d'Apache..."
              sudo apt-get update
              sudo apt-get install -y apache2
            fi

            # Installer les modules Apache nécessaires
            echo "📦 Activation des modules Apache nécessaires..."
            sudo a2enmod proxy
            sudo a2enmod proxy_http
            sudo a2enmod ssl
            sudo a2enmod rewrite
            sudo a2enmod headers

            # Vérifier si nginx est installé et en conflit
            if systemctl is-active --quiet nginx 2>/dev/null; then
              echo "⚠️  Nginx est actif. Arrêt de nginx pour éviter les conflits..."
              sudo systemctl stop nginx
              sudo systemctl disable nginx
            fi

            # S'assurer qu'Apache est démarré et activé
            if ! systemctl is-active --quiet apache2; then
              echo "🚀 Démarrage d'Apache..."
              sudo systemctl start apache2
            fi
            if ! systemctl is-enabled --quiet apache2; then
              echo "✅ Activation d'Apache au démarrage..."
              sudo systemctl enable apache2
            fi

            # Déployer les fichiers de configuration Apache
            echo "📝 Déploiement des configurations Apache..."

            # Copier la configuration HTTP
            if [ -f /tmp/novlearn.fr.conf ]; then
              sudo cp /tmp/novlearn.fr.conf /etc/apache2/sites-available/novlearn.fr.conf
              echo "✅ Configuration HTTP déployée"
            else
              echo "❌ Erreur: /tmp/novlearn.fr.conf introuvable"
              exit 1
            fi

            # Copier la configuration HTTPS
            if [ -f /tmp/novlearn.fr-le-ssl.conf ]; then
              sudo cp /tmp/novlearn.fr-le-ssl.conf /etc/apache2/sites-available/novlearn.fr-le-ssl.conf
              echo "✅ Configuration HTTPS déployée"
            else
              echo "❌ Erreur: /tmp/novlearn.fr-le-ssl.conf introuvable"
              exit 1
            fi

            # Activer les sites Apache
            echo "🔗 Activation des sites Apache..."
            sudo a2ensite novlearn.fr.conf
            sudo a2ensite novlearn.fr-le-ssl.conf

            # Désactiver le site par défaut d'Apache s'il existe
            if [ -f /etc/apache2/sites-enabled/000-default.conf ]; then
              echo "🔇 Désactivation du site par défaut d'Apache..."
              sudo a2dissite 000-default.conf
            fi

            # Tester la configuration Apache
            echo "🔍 Test de la configuration Apache..."
            if sudo apache2ctl configtest; then
              echo "✅ Configuration Apache valide"
            else
              echo "❌ Erreur dans la configuration Apache"
              exit 1
            fi

            # Recharger Apache
            echo "🔄 Rechargement d'Apache..."
            sudo systemctl reload apache2 || sudo systemctl restart apache2

            # Vérifier qu'Apache est actif
            if systemctl is-active --quiet apache2; then
              echo "✅ Apache est actif et fonctionne"
            else
              echo "❌ Erreur: Apache n'est pas actif"
              sudo systemctl status apache2
              exit 1
            fi

            # Créer le répertoire .well-known si nécessaire
            sudo mkdir -p /var/www/novlearn/.well-known
            sudo chown -R $USER:$USER /var/www/novlearn

      - name: Setup and deploy application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Créer les répertoires si nécessaire
            sudo mkdir -p /opt/novlearn
            sudo chown -R $USER:$USER /opt/novlearn

            # ------------------------------------------------------------------
            # CORRECTIF DU PROBLEME PAGE/ROUTE PARALLELES
            # On supprime explicitement le fichier fantôme sur le VPS
            # ------------------------------------------------------------------
            if [ -f "/opt/novlearn/frontend/app/auth/callback/page.tsx" ]; then
              echo "🗑️ Suppression du fichier fantôme page.tsx..."
              rm -f /opt/novlearn/frontend/app/auth/callback/page.tsx
            fi

            # On nettoie aussi le cache du build précédent
            echo "🧹 Nettoyage du cache .next..."
            rm -rf /opt/novlearn/frontend/.next
            # ------------------------------------------------------------------

            # Installer Node.js et npm si nécessaire
            if ! command -v node &> /dev/null || ! command -v npm &> /dev/null; then
              echo "📦 Installation de Node.js et npm..."
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs
              # S'assurer que npm est installé (NodeSource inclut généralement npm, mais vérifions)
              if ! command -v npm &> /dev/null; then
                echo "⚠️  npm n'est pas disponible, installation via apt..."
                sudo apt-get install -y npm
              fi
            fi

            # Trouver les emplacements de node et npm
            NODE_PATH=$(which node 2>/dev/null || echo "/usr/bin/node")
            NPM_PATH=$(which npm 2>/dev/null || echo "/usr/bin/npm")

            # Vérifier et mettre à jour le PATH pour Node.js/npm
            export PATH="/usr/bin:/usr/local/bin:$PATH"

            # Si node ou npm sont dans un autre répertoire, l'ajouter au PATH
            if [ -f "$NODE_PATH" ]; then
              NODE_DIR=$(dirname "$NODE_PATH")
              export PATH="$NODE_DIR:$PATH"
            fi
            if [ -f "$NPM_PATH" ]; then
              NPM_DIR=$(dirname "$NPM_PATH")
              export PATH="$NPM_DIR:$PATH"
            fi

            # Vérifier que node et npm sont accessibles
            echo "🔍 Vérification de Node.js et npm..."
            if ! node --version; then
              echo "❌ Erreur: node non accessible"
              echo "Recherche de node dans le système..."
              find /usr -name node 2>/dev/null | head -5
              exit 1
            fi
            if ! npm --version; then
              echo "❌ Erreur: npm non accessible"
              echo "Recherche de npm dans le système..."
              find /usr -name npm 2>/dev/null | head -5
              exit 1
            fi
            echo "✅ Node.js $(node --version) et npm $(npm --version) sont disponibles"

            # Installer les services systemd
            echo "🔧 Configuration des services systemd..."

            # Service backend - toujours mettre à jour
            echo "📝 Mise à jour du service backend..."
            sudo sed "s/YOUR_USERNAME/$USER/g" /tmp/novlearn-backend.service > /tmp/novlearn-backend.service.tmp
            sudo mv /tmp/novlearn-backend.service.tmp /etc/systemd/system/novlearn-backend.service
            sudo systemctl daemon-reload

            if sudo systemctl is-enabled novlearn-backend 2>&1 | grep -q "masked"; then
              echo "🔓 Démasquage du service novlearn-backend..."
              sudo systemctl unmask novlearn-backend
            fi
            sudo systemctl enable novlearn-backend

            # Redémarrer le service backend pour appliquer les changements
            if sudo systemctl is-active --quiet novlearn-backend; then
              echo "🔄 Redémarrage du service backend..."
              sudo systemctl restart novlearn-backend
            else
              echo "🚀 Démarrage du service backend..."
              sudo systemctl start novlearn-backend
            fi

            # Service frontend - toujours mettre à jour
            echo "📝 Mise à jour du service frontend..."
            sudo sed "s/YOUR_USERNAME/$USER/g" /tmp/novlearn-frontend.service > /tmp/novlearn-frontend.service.tmp
            sudo mv /tmp/novlearn-frontend.service.tmp /etc/systemd/system/novlearn-frontend.service
            sudo systemctl daemon-reload

            if sudo systemctl is-enabled novlearn-frontend 2>&1 | grep -q "masked"; then
              echo "🔓 Démasquage du service novlearn-frontend..."
              sudo systemctl unmask novlearn-frontend
            fi
            sudo systemctl enable novlearn-frontend

            # Redémarrer le service frontend s'il est actif, sinon le démarrer
            if sudo systemctl is-active --quiet novlearn-frontend; then
              echo "🔄 Redémarrage du service frontend..."
              sudo systemctl restart novlearn-frontend
            else
              echo "🚀 Démarrage du service frontend..."
              sudo systemctl start novlearn-frontend
            fi

            # Naviguer vers le répertoire de déploiement
            cd /opt/novlearn

            # Rendre le script de déploiement exécutable
            chmod +x deploy.sh

            # Créer le fichier .env pour le frontend avec les variables Supabase
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > /opt/novlearn/frontend/.env.local
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> /opt/novlearn/frontend/.env.local

            # Exécuter le script de déploiement avec le PATH correct
            # S'assurer que node et npm sont dans le PATH pour le script
            export PATH="/usr/bin:/usr/local/bin:$PATH"
            ./deploy.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Attendre un peu pour le démarrage
            sleep 5

            # Vérifier que le fichier .env existe
            echo "🔍 Vérification de la configuration..."
            if [ ! -f /opt/novlearn/backend/.env ]; then
              echo "❌ Erreur: fichier .env introuvable dans /opt/novlearn/backend/"
              exit 1
            fi

            # Vérifier qu'Apache est actif
            echo "🔍 Vérification d'Apache..."
            if ! systemctl is-active --quiet apache2; then
              echo "❌ Apache n'est pas actif"
              sudo systemctl status apache2
              exit 1
            fi
            echo "✅ Apache est actif"

            # Vérifier que le backend répond directement
            echo "🔍 Test du health check backend (port 8010)..."
            curl -f http://localhost:8010/health || {
              echo "❌ Le health check backend a échoué"
              echo "Logs du backend (50 dernières lignes):"
              sudo journalctl -u novlearn-backend -n 50 || echo "Aucun log trouvé"
              exit 1
            }
            echo "✅ Backend répond sur le port 8010"

            # Vérifier que le frontend répond directement
            echo "🔍 Test du frontend (port 3000)..."
            sleep 3
            curl -f http://localhost:3000 || {
              echo "❌ Le frontend ne répond pas"
              echo "Logs du frontend (50 dernières lignes):"
              sudo journalctl -u novlearn-frontend -n 50 || echo "Aucun log trouvé"
              exit 1
            }
            echo "✅ Frontend répond sur le port 3000"

            # Vérifier qu'Apache proxy fonctionne correctement
            echo "🔍 Test du proxy Apache (via localhost)..."
            curl -f http://localhost/health || {
              echo "❌ Le proxy Apache ne fonctionne pas correctement"
              echo "Logs Apache (50 dernières lignes):"
              sudo tail -n 50 /var/log/apache2/error_novlearn.log || echo "Aucun log trouvé"
              exit 1
            }
            echo "✅ Proxy Apache fonctionne correctement"

            echo "✅ Déploiement vérifié avec succès"